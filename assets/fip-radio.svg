<svg xmlns="http://www.w3.org/2000/svg" width="430" height="78" viewBox="0 0 430 78" role="img" aria-labelledby="title desc">
  <title id="title">Open FIP Radio</title>
  <desc id="desc">A button linking to the FIP live radio player, where playback can be turned on or off.</desc>
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24292f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .power { transform-origin: 39px 39px; animation: pulse 1.8s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: wave 1s ease-in-out infinite alternate; }
    .bar:nth-of-type(2n) { animation-delay: -.35s; }
    .bar:nth-of-type(3n) { animation-delay: -.7s; }
    @keyframes pulse { 50% { opacity: .58; transform: scale(.92); } }
    @keyframes wave { from { transform: scaleY(.35); opacity: .55; } to { transform: scaleY(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .power, .bar { animation: none; transform: none; } }
  </style>
  <rect x="1" y="1" width="428" height="76" rx="15" fill="url(#button)" stroke="#d13d8c" stroke-width="2"/>
  <g class="power" filter="url(#glow)">
    <circle cx="39" cy="39" r="22" fill="#d13d8c" opacity=".16"/>
    <path d="M39 21v17 M29 27a15 15 0 1 0 20 0" fill="none" stroke="#ff7ab2" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="76" y="34" fill="#f0f6fc" font-size="18" font-weight="700">FIP RADIO</text>
  <text x="76" y="55" fill="#ff7ab2" font-size="12">ON / OFF · CLICK TO LISTEN</text>
  <g fill="#ff7ab2">
    <rect class="bar" x="342" y="29" width="6" height="22" rx="3"/>
    <rect class="bar" x="353" y="20" width="6" height="31" rx="3"/>
    <rect class="bar" x="364" y="25" width="6" height="26" rx="3"/>
    <rect class="bar" x="375" y="16" width="6" height="35" rx="3"/>
    <rect class="bar" x="386" y="23" width="6" height="28" rx="3"/>
    <rect class="bar" x="397" y="31" width="6" height="20" rx="3"/>
  </g>
</svg>

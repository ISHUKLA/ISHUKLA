<svg xmlns="http://www.w3.org/2000/svg" width="430" height="68" viewBox="0 0 430 68" role="img" aria-labelledby="title desc">
  <title id="title">Open FIP Radio</title>
  <desc id="desc">An understated button linking to the FIP live radio player.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2c"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect x="1" y="1" width="428" height="66" rx="9" fill="url(#panel)" stroke="#4a576a" stroke-width="2"/>
  <path d="M18 18 V50" stroke="#315fa4" stroke-width="3"/>
  <path d="M23 18 V50" stroke="#e8ebef" stroke-width="3"/>
  <path d="M28 18 V50" stroke="#a84f58" stroke-width="3"/>
  <text x="47" y="29" fill="#c9a96e" font-size="10" font-weight="700" letter-spacing="2">FIP RADIO</text>
  <text x="47" y="48" fill="#d7dde5" font-family="Georgia, 'Times New Roman', serif" font-size="16">Listen while I build</text>
  <circle cx="389" cy="34" r="18" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
  <path d="M384 26 L397 34 L384 42 Z" fill="#c9a96e"/>
  <text x="389" y="61" text-anchor="middle" fill="#8390a3" font-size="7" letter-spacing="1.2">OPEN PLAYER</text>
</svg>

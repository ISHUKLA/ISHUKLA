<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Shukla A. — Professional impact at a glance</title>
  <desc id="desc">Evidence-led highlights: more than one billion euros of mathematical reserves, more than fifty practising actuaries using SolvaIIRAG, 89 percent Hit at 4 across 127 questions, CFO and CRO alignment, and four human review gates in the Excel Audit Agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2c"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <linearGradient id="reserve-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263a"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .eyebrow { fill: #c9a96e; font-size: 10px; font-weight: 700; letter-spacing: 2.4px; }
    .headline { fill: #f3f5f7; font-size: 24px; }
    .metric { fill: #f6f1e7; font-size: 58px; font-weight: 600; }
    .card-metric { fill: #f3f5f7; font-size: 31px; font-weight: 600; }
    .card-metric-small { fill: #f3f5f7; font-size: 25px; font-weight: 600; }
    .label { fill: #c9a96e; font-size: 9px; font-weight: 700; letter-spacing: 1.45px; }
    .copy { fill: #d7dde5; font-size: 12px; }
    .small { fill: #8f9bae; font-size: 10px; }
    .fine { fill: #77869b; font-size: 9px; letter-spacing: .25px; }
  </style>

  <rect x="1" y="1" width="898" height="378" rx="12" fill="url(#background)" stroke="#2b3c53" stroke-width="2"/>
  <path d="M28 25 H872" stroke="#c9a96e" stroke-width="1" opacity=".55"/>

  <g aria-label="Panel heading">
    <text x="28" y="54" class="eyebrow">PROFESSIONAL IMPACT</text>
    <text x="28" y="85" class="headline serif">Insurance transformation, grounded in actuarial practice.</text>
    <g transform="translate(795 49)" aria-label="French tricolour">
      <rect width="25" height="3" rx="1.5" fill="#315fa4"/>
      <rect x="25" width="25" height="3" fill="#e8ebef"/>
      <rect x="50" width="25" height="3" rx="1.5" fill="#a84f58"/>
    </g>
  </g>

  <g aria-label="More than one billion euros of mathematical reserves">
    <rect x="28" y="110" width="320" height="240" rx="9" fill="url(#reserve-card)" stroke="#3a4b62"/>
    <rect x="28" y="110" width="4" height="240" rx="2" fill="#c9a96e"/>
    <text x="55" y="144" class="label">CAREER-SCALE RESPONSIBILITY</text>
    <text x="53" y="213" class="metric serif">€1bn+</text>
    <text x="55" y="238" class="copy">mathematical reserves</text>
    <path d="M55 262 H320" stroke="#314056"/>
    <text x="55" y="286" class="small">CALCULATED · RECONCILED</text>
    <text x="55" y="304" class="small">INDEPENDENTLY VALIDATED</text>
    <text x="55" y="331" class="fine">SAVINGS + RETIREMENT · RECURRING ASSIGNMENTS</text>
  </g>

  <g aria-label="More than fifty practising actuaries">
    <rect x="366" y="110" width="238" height="112" rx="9" fill="#111e2e" stroke="#2f4057"/>
    <circle cx="579" cy="135" r="4" fill="#315fa4"/>
    <text x="386" y="139" class="label">PRACTISING ACTUARIES</text>
    <text x="384" y="181" class="card-metric serif">50+</text>
    <text x="454" y="175" class="copy">using SolvaIIRAG</text>
    <text x="454" y="193" class="small">to navigate regulation</text>
  </g>

  <g aria-label="89 percent Hit at 4 across 127 questions">
    <rect x="622" y="110" width="250" height="112" rx="9" fill="#111e2e" stroke="#2f4057"/>
    <circle cx="847" cy="135" r="4" fill="#a84f58"/>
    <text x="642" y="139" class="label">RETRIEVAL EVALUATION</text>
    <text x="640" y="181" class="card-metric serif">89%</text>
    <text x="711" y="175" class="copy">Hit@4</text>
    <text x="711" y="193" class="small">127 Solvency II questions</text>
  </g>

  <g aria-label="CFO and CRO alignment">
    <rect x="366" y="238" width="238" height="112" rx="9" fill="#111e2e" stroke="#2f4057"/>
    <text x="386" y="267" class="label">STAKEHOLDER ALIGNMENT</text>
    <text x="384" y="307" class="card-metric-small serif">CFO × CRO</text>
    <text x="386" y="331" class="small">SOLVENCY II SUBMISSIONS</text>
  </g>

  <g aria-label="Four mandatory human review gates">
    <rect x="622" y="238" width="250" height="112" rx="9" fill="#111e2e" stroke="#2f4057"/>
    <text x="642" y="267" class="label">HUMAN-GOVERNED AI</text>
    <text x="640" y="307" class="card-metric-small serif">4 gates</text>
    <g transform="translate(759 286)">
      <circle cx="0" cy="0" r="5" fill="#c9a96e"/>
      <circle cx="20" cy="0" r="5" fill="#c9a96e"/>
      <circle cx="40" cy="0" r="5" fill="#c9a96e"/>
      <circle cx="60" cy="0" r="5" fill="#c9a96e"/>
      <path d="M5 0 H15 M25 0 H35 M45 0 H55" stroke="#c9a96e" opacity=".6"/>
    </g>
    <text x="642" y="331" class="small">EXCEL AUDIT · JUDGEMENT RETAINED</text>
  </g>
</svg>

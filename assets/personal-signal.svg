  <text x="450" y="25" text-anchor="middle" class="subtle">shukla@github: ~ /about_me --play</text>

  <g transform="translate(82 76)"><g class="badge" style="animation-delay:0s"><circle r="23" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text text-anchor="middle" y="5" fill="#58a6ff">Σ</text></g></g><g transform="translate(356 84)"><g class="badge" style="animation-delay:-.8s"><circle r="23" fill="#161b22" stroke="#ff7ab2" stroke-width="1.5"/><text text-anchor="middle" y="5" fill="#ff7ab2">{ }</text></g></g><g transform="translate(76 235)"><g class="badge" style="animation-delay:-1.6s"><circle r="23" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text text-anchor="middle" y="5" fill="#d29922">♫</text></g></g><g transform="translate(362 225)"><g class="badge" style="animation-delay:-2.4s"><circle r="23" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/><text text-anchor="middle" y="5" fill="#7ee787">AI</text></g></g>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated actuarial scenario signal</title>
  <desc id="desc">Illustrative savings and retirement projections reveal downside, central, and upside paths, followed by data, assumptions, scenarios, and human judgement.</desc>
  <defs>
    <linearGradient id="fan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d29922" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { fill: #c9d1d9; font-size: 13px; font-weight: 600; }
    .subtle, .axis-label { fill: #8b949e; font-size: 10px; }
    .grid { stroke: #21262d; stroke-width: 1; }
    .fan { opacity: 0; animation: fade-in .8s .35s ease-out forwards; }
    .projection {
      fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1200; stroke-dashoffset: 1200;
      animation: draw-path 2.1s cubic-bezier(.2,.75,.25,1) forwards;
    }
    .projection.downside { stroke: #d29922; }
    .projection.central { stroke: #58a6ff; stroke-width: 3.6; }
    .projection.upside { stroke: #7ee787; }
    .end-label { opacity: 0; animation: fade-in .35s ease-out forwards; font-size: 10px; }
    .scan { opacity: 0; animation: scan 2.8s .45s ease-in-out forwards; }
    .flow-node { opacity: 0; transform: translateY(8px); animation: node-in .35s ease-out forwards; }
    .flow-node rect { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .flow-node text { fill: #c9d1d9; font-size: 12px; }
    .judgement-node rect { fill: #10251a; stroke: #7ee787; }
    .judgement-node text { fill: #7ee787; font-weight: 600; }
    .judgement-node { animation-name: node-in, judgement-pulse; animation-duration: .35s, 1.1s; animation-iteration-count: 1, 2; animation-fill-mode: forwards, none; }
    .flow-arrow { fill: none; stroke: #484f58; stroke-width: 1.5; stroke-dasharray: 46; stroke-dashoffset: 46; animation: arrow-in .35s linear forwards; }
    .static { opacity: 1; transform: none; animation: none; stroke-dashoffset: 0; }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes scan { 0% { opacity: 0; transform: translateX(0); } 12% { opacity: 1; } 88% { opacity: .7; } 100% { opacity: 0; transform: translateX(736px); } }
    @keyframes node-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes arrow-in { to { stroke-dashoffset: 0; } }
    @keyframes judgement-pulse { 50% { filter: drop-shadow(0 0 5px #7ee787); } }
    @media (prefers-reduced-motion: reduce) {
      .fan, .projection, .end-label, .flow-node, .flow-arrow { opacity: 1; transform: none; animation: none; stroke-dashoffset: 0; }
      .scan { display: none; }
    }
  </style>
  <rect x="1" y="1" width="898" height="318" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="20" cy="21" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="21" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="21" r="5" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="subtle">scenario_engine · savings &amp; retirement</text>
  <text x="32" y="51" class="title">Illustrative projection fan</text>
  <text x="868" y="51" text-anchor="end" class="subtle">EPV = Σ CFₜ × pₜ × vᵗ · not model output</text>
  <line x1="64.0" y1="95" x2="800.0" y2="95" class="grid"/>
  <line x1="64.0" y1="137" x2="800.0" y2="137" class="grid"/>
  <line x1="64.0" y1="188.0" x2="800.0" y2="188.0" class="grid"/>
  <polygon class="fan" points="64.00,184.52 186.67,174.08 309.33,161.33 432.00,145.09 554.67,125.37 677.33,101.02 800.00,70.87 800.00,152.63 677.33,159.59 554.67,165.96 432.00,171.76 309.33,176.98 186.67,181.04 64.00,184.52" fill="url(#fan)"/>
  <path class="projection downside" style="animation-delay:0.90s" d="M 64.00 184.52 C 84.44 183.94, 145.78 182.30, 186.67 181.04 C 227.56 179.79, 268.44 178.53, 309.33 176.98 C 350.22 175.44, 391.11 173.60, 432.00 171.76 C 472.89 169.93, 513.78 167.99, 554.67 165.96 C 595.56 163.94, 636.44 161.81, 677.33 159.59 C 718.22 157.36, 779.56 153.79, 800.00 152.63"/><path class="projection central" style="animation-delay:0.65s" d="M 64.00 184.52 C 84.44 183.36, 145.78 180.17, 186.67 177.56 C 227.56 174.95, 268.44 172.05, 309.33 168.86 C 350.22 165.67, 391.11 162.20, 432.00 158.43 C 472.89 154.66, 513.78 150.60, 554.67 146.25 C 595.56 141.90, 636.44 137.36, 677.33 132.33 C 718.22 127.31, 779.56 118.80, 800.00 116.10"/><path class="projection upside" style="animation-delay:1.15s" d="M 64.00 184.52 C 84.44 182.78, 145.78 177.95, 186.67 174.08 C 227.56 170.22, 268.44 166.16, 309.33 161.33 C 350.22 156.49, 391.11 151.08, 432.00 145.09 C 472.89 139.10, 513.78 132.72, 554.67 125.37 C 595.56 118.03, 636.44 110.10, 677.33 101.02 C 718.22 91.93, 779.56 75.89, 800.00 70.87"/>
  <line class="scan" x1="64.0" y1="58" x2="64.0" y2="190" stroke="url(#sweep)" stroke-width="2"/>
  <g class="end-label" style="animation-delay:2.70s"><circle cx="800.00" cy="152.63" r="4" fill="#d29922"/><text x="812.00" y="157.63" fill="#d29922">Downside</text></g><g class="end-label" style="animation-delay:2.45s"><circle cx="800.00" cy="116.10" r="4" fill="#58a6ff"/><text x="812.00" y="120.10" fill="#58a6ff">Central</text></g><g class="end-label" style="animation-delay:2.95s"><circle cx="800.00" cy="70.87" r="4" fill="#7ee787"/><text x="812.00" y="66.87" fill="#7ee787">Upside</text></g>
  <text x="64.00" y="207" text-anchor="middle" class="axis-label">Year 0</text><text x="309.33" y="207" text-anchor="middle" class="axis-label">Year 10</text><text x="554.67" y="207" text-anchor="middle" class="axis-label">Year 20</text><text x="800.00" y="207" text-anchor="middle" class="axis-label">Year 30</text>
  <text x="32" y="229" class="subtle">actuarial workflow</text>
  <path class="flow-arrow" style="animation-delay:3.20s" d="M 208 265 L 235 265"/><path class="flow-arrow" style="animation-delay:3.55s" d="M 419 265 L 446 265"/><path class="flow-arrow" style="animation-delay:3.90s" d="M 630 265 L 657 265"/>
  <g class="flow-node" style="animation-delay:3.00s"><rect x="32" y="244" width="170" height="42" rx="10"/><text x="117" y="270" text-anchor="middle">Data</text></g><g class="flow-node" style="animation-delay:3.35s"><rect x="243" y="244" width="170" height="42" rx="10"/><text x="328" y="270" text-anchor="middle">Assumptions</text></g><g class="flow-node" style="animation-delay:3.70s"><rect x="454" y="244" width="170" height="42" rx="10"/><text x="539" y="270" text-anchor="middle">Scenarios</text></g><g class="flow-node judgement-node" style="animation-delay:4.05s"><rect x="665" y="244" width="170" height="42" rx="10"/><text x="750" y="270" text-anchor="middle">Judgement</text></g>
</svg>

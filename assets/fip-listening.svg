<svg xmlns="http://www.w3.org/2000/svg" width="350" height="76" viewBox="0 0 350 76" role="img" aria-labelledby="title desc">
  <title id="title">Listen to FIP</title>
  <desc id="desc">A dark listening card with a colourful FIP radio icon and a play button.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2c"/>
      <stop offset="1" stop-color="#09111d"/>
    </linearGradient>
    <linearGradient id="fip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8054b8"/>
      <stop offset="0.52" stop-color="#c64c87"/>
      <stop offset="1" stop-color="#ee7a60"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect x="1" y="1" width="348" height="74" rx="11" fill="url(#panel)" stroke="#4a576a" stroke-width="2"/>
  <rect x="15" y="14" width="48" height="48" rx="13" fill="url(#fip)"/>
  <path d="M23 48 V28 M28 53 V23 M33 48 V28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <text x="41" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" letter-spacing="-.8">fip</text>
  <text x="78" y="31" fill="#c9a96e" font-size="10" font-weight="700" letter-spacing="1.7">RADIO FRANCE · FIP</text>
  <text x="78" y="52" fill="#d7dde5" font-family="Georgia, 'Times New Roman', serif" font-size="16">Listen while I build</text>
  <circle cx="317" cy="38" r="18" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
  <path d="M312 30 L325 38 L312 46 Z" fill="#c9a96e"/>

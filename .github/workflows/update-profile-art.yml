name: Refresh profile activity

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the small runtime dependency set
        run: pip install -r scripts/requirements.txt
      - name: Fetch public activity and render the SVG
        run: python scripts/contributions.py --username ISHUKLA
      - name: Commit only when the generated data changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-graph.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile activity [skip ci]"
          git push
